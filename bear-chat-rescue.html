<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>钟熊 · 安全诊断</title><style>body{font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;background:#fff8ee;color:#64452e;padding:24px;max-width:620px;margin:32px auto}h1{font-size:23px}button{padding:12px 16px;border:0;border-radius:12px;background:#efb13e;color:#4d321e;font-size:16px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:15px;border-radius:12px}small{color:#8a735f}</style></head><body><h1>🐻 钟熊 · 安全诊断页</h1><p>这是独立于聊天程序的轻量页面。<strong>不会清理、覆盖或上传数据，也不会连接云端。</strong></p><p id="status">页面已加载。尚未读取聊天数据。</p><button id="inspect">检查本机数据（只显示大小）</button><button id="backup">导出本机备份（包含敏感密钥）</button><pre id="output">请先点击检查按钮。</pre><small>请勿将导出的 JSON 公开分享。它可能包含 API 密钥和 GitHub 令牌。只有部署到与原钟熊相同的 github.io 域名下，才可读取相同的 localStorage；无痕模式与普通模式数据隔离。</small><script>
const out=document.getElementById('output');const st=document.getElementById('status');
const wanted=['kb_chat','kb_aff','kb_settings','kb_diaries','kb_memo_at','kb_sync_at','kb_lastopen','kb_memory_signature'];
document.getElementById('inspect').onclick=()=>{try{const result={origin:location.origin,path:location.pathname,keys:[]};for(const k of wanted){let v=localStorage.getItem(k);result.keys.push({name:k,present:v!==null,characters:v?.length||0});}out.textContent=JSON.stringify(result,null,2);st.textContent='本地数据检查完成（未修改任何数据）。'}catch(e){st.textContent='读取数据失败：'+String(e);}};
document.getElementById('backup').onclick=()=>{try{const values={};for(const k of wanted)values[k]=localStorage.getItem(k);const snapshot={format:'bear-chat-full-local-backup-v1',createdAt:new Date().toISOString(),origin:location.origin,values};const blob=new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bear-chat-safari-rescue-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);a.remove();st.textContent='已请求下载本机备份；请在文件 App 核对文件。'}catch(e){st.textContent='备份失败：'+String(e);}};
</script></body></html>
