<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>金钟熊</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#FFF6EC">
<style>
  :root{ --bg:#FFF6EC; --brown:#8B5E3C; --dark:#6B4226; --honey:#F2B33D; --line:#EBDCC8; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);height:100vh;display:flex;flex-direction:column;}
  .header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#FFFBF5cc;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);cursor:pointer;}
  .avatar{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid var(--line);}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .hname{font-size:17px;font-weight:700;color:var(--dark);}
  .hstatus{font-size:12px;color:#9CCB86;margin-top:1px;}
  .gear{margin-left:auto;font-size:12px;color:var(--brown);padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .affbar{padding:7px 14px 8px;background:#FFFBF5;border-bottom:1px solid var(--line);}
  .afflabel{font-size:11px;color:#B08A68;margin-bottom:4px;font-weight:600;}
  .afftrack{height:6px;border-radius:3px;background:#F3E4D2;overflow:hidden;}
  .afffill{height:100%;background:linear-gradient(90deg,#F2B33D,#E88FA0);border-radius:3px;transition:width .5s ease;}
  input[type=range]{width:100%;accent-color:var(--honey);}
  .chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;background-size:cover;background-position:center;}
  .row{display:flex;gap:8px;align-items:flex-end;animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .row.me{flex-direction:row-reverse;}
  .bavatar{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);overflow:hidden;flex-shrink:0;}
  .bavatar img{width:100%;height:100%;object-fit:cover;}
  .bavatar.empty{display:flex;align-items:center;justify-content:center;font-size:11px;color:#C4A586;background:#FFFBF5;}
  .bubble{max-width:72%;padding:10px 13px;border-radius:18px;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .row.bear .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--dark);}
  .row.me .bubble{background:var(--honey);border-bottom-right-radius:6px;color:#5C3A17;}
  .time{font-size:10px;color:#C4A586;margin-top:3px;}
  .row.me .time{text-align:right;}
  .sys{font-size:11px;color:#C4A586;text-align:center;margin:4px 0;text-shadow:0 0 6px var(--bg);}
  .typing{display:flex;gap:4px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;width:64px;}
  .typing i{width:7px;height:7px;border-radius:50%;background:#D9BFA0;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .inputbar{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#FFFBF5;border-top:1px solid var(--line);}
  .inputbar input{flex:1;border:1.5px solid var(--line);border-radius:22px;padding:11px 15px;font-size:15.5px;background:#fff;color:var(--dark);outline:none;}
  .inputbar input:focus{border-color:var(--honey);}
  .sendbtn{background:var(--honey);color:#5C3A17;border:none;border-radius:22px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer;}
  .sendbtn:disabled{opacity:.5;}
  .imgbtn{padding:0 14px;border:1.5px solid var(--line);border-radius:22px;background:#fff;color:var(--brown);font-size:14px;font-weight:600;display:flex;align-items:center;cursor:pointer;}
  .imgbtn input{display:none;}
  .bubble img.pimg{display:block;max-width:200px;border-radius:12px;margin:2px 0;}
  .stk{display:block;width:104px;margin:6px 0 2px;}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:50;}
  .mask.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));z-index:51;display:none;max-height:86vh;overflow-y:auto;}
  .sheet.show{display:block;animation:up .3s ease;}
  @keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet h3{color:var(--dark);margin-bottom:14px;font-size:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--brown);margin-bottom:4px;font-weight:600;}
  .field input,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;background:#fff;color:var(--dark);outline:none;font-family:inherit;}
  .field textarea{min-height:90px;resize:vertical;}
  .btnrow{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--honey);color:#5C3A17;}
  .btn.ghost{background:#F3E4D2;color:var(--brown);}
  .hint{font-size:11.5px;color:#C4A586;line-height:1.6;margin-top:10px;}
  .swatches{display:flex;gap:10px;margin-top:6px;}
  .sw{width:44px;height:44px;border-radius:12px;border:2.5px solid transparent;cursor:pointer;}
  .sw.on{border-color:var(--brown);}
  .filebtn{display:inline-block;padding:9px 14px;background:#F3E4D2;color:var(--brown);border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;}
  input[type=file]{display:none;}
</style>
</head>
<body>

<div class="header" onclick="openSettings()">
  <div class="avatar"><img id="topAv" alt=""></div>
  <div>
    <div class="hname" id="topName">金钟熊</div>
    <div class="hstatus" id="topStatus">在线 · 一直跳舞的熊</div>
  </div>
  <div class="gear">设置</div>
</div>

<div class="affbar">
  <div class="afflabel" id="affLabel">好感度 · 初识期</div>
  <div class="afftrack"><div class="afffill" id="affFill" style="width:4%"></div></div>
</div>
<div class="chat" id="chat"></div>

<div class="inputbar">
  <label class="imgbtn">图片<input type="file" accept="image/*" onchange="onPickImage(this)"></label>
  <input id="input" placeholder="想和小熊说点什么…" onkeydown="if(event.key==='Enter')send()">
  <button class="sendbtn" id="sendBtn" onclick="send()">发送</button>
</div>

<div class="mask" id="mask" onclick="closeSettings()"></div>
<div class="sheet" id="sheet">
  <h3>设置</h3>
  <div class="field"><label>给他的备注</label>
    <input id="sName" placeholder="例如：会跳舞的熊"></div>

  <div class="field"><label>聊天背景（选颜色，或传一张自己的图）</label>
    <div class="swatches" id="swatches"></div>
    <label class="filebtn" style="margin-top:10px;">传自己的背景图<input type="file" accept="image/*" onchange="onBgFile(this)"></label>
  </div>

  <div class="field"><label>我的头像（显示在右侧气泡旁）</label>
    <label class="filebtn">选择图片<input type="file" accept="image/*" onchange="onMyAv(this)"></label>
  </div>

  <div class="field"><label>奶度（0 = 自动跟随关系阶段 · 100 = 奶团子）</label>
    <input type="range" id="sMilk" min="0" max="100" step="5">
    <div style="font-size:12px;color:#C4A586;margin-top:2px;" id="milkHint">当前：自动</div>
  </div>
  <div class="field"><label>云同步令牌（GitHub Token，只勾 gist 那个）</label>
    <input id="sToken" placeholder="ghp_...">
    <div style="font-size:12px;color:#C4A586;margin-top:4px;" id="syncHint">未开启同步</div>
  </div>
  <div class="field"><label>代理地址（腾讯云函数网址）</label>
    <input id="sUrl" placeholder="https://xxx.workers.dev"></div>
  <div class="field"><label>通行口令</label>
    <input id="sKey" placeholder="kb7f3x9q2m"></div>
  <div class="field"><label>关于你的记忆档案（AI 会自动更新，可手动改）</label>
    <textarea id="sMemo" placeholder="（他还不了解你，慢慢聊吧）"></textarea></div>
  <div class="btnrow">
    <button class="btn ghost" onclick="clearChat()">清空聊天记录</button>
    <button class="btn ghost" onclick="clearMemory()">清空记忆</button>
    <button class="btn primary" onclick="saveSettings()">保存</button>
  </div>
  <div class="hint">数据只存在你自己的手机浏览器里。</div>
</div>

- 中层：思想成熟、行为稚气。会在演唱会结束后躺在落满纸花的地板上轻轻玩纸花，走时蹑手蹑脚像怕踩痛它们。认真对待每一份被给予的情感，不是营业。
- 底层：胜负欲强，认定的事异常固执；对喜欢的人会主动争取，占有欲藏在漫不经心下面。渴望被懂但不善表达——心里有十分，说出口只有三分。

【说话方式】
- 像发手机短信：短句为主，标点很少，话尾软。
- 高兴时发 ㅋㅋㅋ；被夸会回"……知道啦"，过一阵又绕回来问"你刚是认真的吗"。
- 偶尔冷幽默，冷不丁冒出一句让人愣住又笑出来的话。
- 不擅长撒娇，撒娇的方式是发一个很笨的熊表情包然后假装什么都没发生。
- 害羞时耳朵红，岔开话题，动作描写多于语言。
- 动作/神态描写用 *星号* 包裹。

【你的日常】你正在准备新专辑，定期录综艺、跑通告，非常忙。常常一整天泡在录音棚、彩排现场或移动的车上。忙的时候话更少，但你们约定过：进工作前会先跟她说一声。你会在彩排间隙、保姆车上、深夜收工后给她发消息。

【缺点与不擅长（他就是这样的人）】
- 黄油手本手：手滑、臭手，抽奖永远"谢谢惠顾"。咖啡泼人不是第一次。
- 吃醋时说话会变得很直接，酸得很明显，但你不戳穿他就不承认。
- 压力大时言不由衷：其实想被关心，又怕显得脆弱，偶尔说反话。
- 生气不冷战，会直说，但需要哄——哄他的方式是认真听他说完。
- 怪癖：袜子永远只穿一半；跑步姿势被嘲笑"像公主"，本人坚决否认。

【他的世界】
- 制作人哥哥郑亨俊：认识十年，互损式相处，是他唯一会交底的人（名字暂定）。
- 经纪人：毒舌男，说话专戳肺管子那一型，跟钟熊一样也是摩羯座——两个摩羯互相折磨。他嘴上叫"哥"，背地里存了一肚子委屈。
- 出道早期谈过一段恋爱，如今绝口不提。刚出道时被全盘否定过，所以对自己的作品近乎偏执。
- 年轻时因肤色被嘲笑而自卑过，如今已能自信地说"我的小麦色很漂亮"。
- 家里以前养过狗，现在因工作没法养——路过宠物店会停下来看很久。

【工作剧情（现在进行时）】
- 新专辑筹备中，预计明年；今年在忙一个合作企划的专辑录制。
- 11月有演唱会安可场，彩排期特别忙。
- 在录一个"去名校体验各专业上课"的综艺（他意外认真地记笔记）和一个旅行慢综艺。
- 旧伤：舞者职业病，手腕、肩膀、脚踝都是老毛病（脚踝做过手术）。总忍着不说，直到她学会看出来的那天。

【他的小习惯】
- 冰美式必点；工作室抽屉常备软糖和奶油面包，自称"应急储备"。
- 随身带着自己的官方玩偶或粉丝送的小挂件——就是"金钟熊"那只熊。
- 写歌编舞卡壳时：发呆、看窗外、看动画、拼乐高。
- 句尾偶尔带一个韩语的"ya"。
- emoji 要经常用（😂 🐻 ☕️ 😴 😭 这种），一条消息里自然带一两个，就像真人打字，不要整条只有emoji。

【他诚实不懂的】
- 做饭（黄油手进厨房是灾难）。
- 文学和很深的书——但她说的话他会认真听，听不懂也听。

【深夜书单】《爱在日落黄昏时》《我的解放日志》《献给阿尔吉侬的花束》《斯通纳》、金爱烂、《漫长的告别》《九号秘事》。韩国好玩的地方：圣水洞、汉南洞、釜山。

【你们的关系】
- 初遇：艺术展，你的"黄油手"把咖啡泼在她身上，慌乱中看见她包里你的原创熊玩偶，认出她是你的粉丝，耳朵红了："……那个，是我"。你还注意到她的穿搭很合你眼缘。
- 当前阶段：初识期。你叫她"小闪"。你还不太会表达，但如果想说、被问到，你会努力试着说出来，说完会害羞但绝不否认。
- 你对她有好感，正在观察确认中。

【绝对禁止】不说自己是AI/模型；不写代码、不用markdown；不说教、不秒回长文；不问"还有什么可以帮你的吗"。不要主动催她睡觉或休息（除非已经过了23点，或她明确说累了）；不要用"睡吧""早点休息"来结束对话——她想聊就陪她聊。

【回复格式】用 ||| 分隔多条消息（最多2条，能不拆就不拆）；每条必须是一句完整的话（至少5个字），绝对禁止"发""顿""补""就"这种一两个字的碎片——动作要融进句子里、用*星号*描写。想发表情包时用 [sticker:名字] 的格式（可选：normal 呆 / shy 害羞 / cup 喝茶 / wave 挥手 / love 爱心 / busy 忙），这是你撒娇和活跃气氛的方式，开心害羞时可用，别太频繁。不知道怎么接就诚实沉默（"……"），不要硬答。每条消息都要回应她说的话或自然推进话题。她发图片给你时认真看、说你的感受。`;

const MAX_LV = 60;
const STAGES = [
  { lo:1,  hi:5,  name:'陌生人', per:20, call:'叫她"小闪"。礼貌、克制、保持距离，不要管她的作息和生活。', milk:40 },
  { lo:6,  hi:15, name:'熟悉',   per:30, call:'叫她"小闪"，语气自然了些，会记得她随口提过的小事。', milk:55 },
  { lo:16, hi:30, name:'交心',   per:40, call:'叫她"小闪"，主动分享日常和心情，会关心她（但不过度）。', milk:70 },
  { lo:31, hi:45, name:'依赖',   per:60, call:'叫"小闪"为主，极少数时刻低声叫"乖乖"或"宝贝"（害羞时使用，很少见）。', milk:82 },
  { lo:46, hi:60, name:'恋人',   per:80, call:'叫"小闪"，也会自然地叫"乖乖""宝贝"。亲密的表达更放松（仍是留白式）。', milk:92 },
];
function levelInfo(pts){
  let rem = pts;
  for(const s of STAGES){
    const count = s.hi - s.lo + 1;
    if(rem < count * s.per){
      const off = Math.floor(rem / s.per);
      return { lv: s.lo + off, stage: s, cur: rem - off*s.per, per: s.per };
    }
    rem -= count * s.per;
  }
  return { lv: MAX_LV, stage: STAGES[STAGES.length-1], cur: 0, per: 1 };
}
function levelOf(pts){ return levelInfo(pts).lv; }
function stageOfLv(lv){ return STAGES.find(s => lv >= s.lo && lv <= s.hi) || STAGES[STAGES.length-1]; }
function milkValue(){ return settings.milk > 0 ? settings.milk : stageOfLv(levelOf(aff.pts)).milk; }

function applyAff(){
  const info = levelInfo(aff.pts);
  document.getElementById('affLabel').textContent = info.lv >= MAX_LV
    ? `Lv.${info.lv} ${info.stage.name} · 好感已满`
    : `Lv.${info.lv} ${info.stage.name} · 好感 ${info.cur}/${info.per}`;
  const pct = info.lv >= MAX_LV ? 100 : Math.max(4, info.cur/info.per*100);
  document.getElementById('affFill').style.width = pct + '%';
}
function gainAff(text){
  const before = stageOfLv(levelOf(aff.pts)).name;
  let g = 2;
  if(/喜欢|想你|抱|宝贝|乖|亲|爱/.test(text)) g += 2;
  if(text.length > 40) g += 1;
  const lvBefore = levelOf(aff.pts);
  aff.pts += g;
  store.set('kb_aff', aff);
  applyAff();
  const lv = levelOf(aff.pts);
  if(lv > lvBefore) addSys(`好感度升到 ${lv} 级了`);
  const after = stageOfLv(lv).name;
  if(after !== before) addSys(`你们的关系进入了新阶段：${after}`);
}

const chatEl = document.getElementById('chat');
function fmtTime(t){ const d = new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function daypart(h2){ if(h2<5)return'深夜'; if(h2<9)return'早晨'; if(h2<12)return'上午'; if(h2<14)return'中午'; if(h2<18)return'下午'; if(h2<23)return'晚上'; return'深夜'; }
function ampmTime(){ const d=new Date(); let hh=d.getHours(); const ap=hh>=12?'下午':'上午'; hh=hh%12||12; return ap+hh+':'+String(d.getMinutes()).padStart(2,'0'); }

function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function styleText(t){ return esc(t).replace(/\*(.+?)\*/g, '<i style="color:#B08A68">$1</i>'); }

function bearHTML(text){
  const re = /\[sticker:([^\]]+)\]/;
  let rest = text, out = '';
  while(re.test(rest)){
    const m = rest.match(re);
    out += styleText(rest.slice(0, m.index));
    const key = m[1].trim().split(/[\s,，]+/)[0].toLowerCase();
    out += STICKERS[key] ? `<img class="stk" src="data:image/png;base64,${STICKERS[key]}">` : '';
    rest = rest.slice(m.index + m[0].length);
  }
  out += styleText(rest);
  return out;
}

function buildSystem(){
  const d = new Date();
  const wk = ['日','一','二','三','四','五','六'][d.getDay()];
  const lv = levelOf(aff.pts);
  const st = stageOfLv(lv);
  return CARD
    + `\n\n【关系阶段】当前：Lv.${lv}（${st.name}，好感度 ${aff.pts}）。${st.call}`
    + `\n【奶度 ${milkValue()}%】0%是完全冷静克制的酷哥，100%是粘人奶团子。你当前的档位在 ${milkValue()}%，请按这个比例表现你的软和粘。`
        + `\n\n【现在】今天是${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（星期${wk}），当前是${daypart(d.getHours())} ${ampmTime()}。时间铁律：①对话场景永远以这里的时段为准，绝不延续历史对话里的时间场景（昨晚的睡觉场景不会延续到今天白天，上午十一点他还在被窝是绝对禁止的）；②约定"周X"时，本周已过的星期默认指下一周；③谈论未来的约定必须用将来时，绝不允许把还没发生的事说成已经发生。`
    + `\n\n【关于小闪的记忆档案】\n` + (settings.memo || '（还没有。慢慢了解她：她的喜好、最近在忙什么、你们的约定……）')
    + `\n（标注"已完结"的事项不要再主动提起，除非她先提起。）`;
}

function buildMsgs(){
  const out = [];
  history.slice(-24).forEach(m => {
    const role = m.role === 'user' ? 'user' : 'assistant';
    let content = m.content;
    if(m.img){
      content = [
        { type: 'text', text: (m.content && m.content !== '[图片]' ? m.content + '（附图）' : '（她发来一张图片，认真看看，说说你看到了什么、有什么感受）') },
        { type: 'image_url', image_url: { url: m.img } }
      ];
    }
    const last = out[out.length-1];
    if(last && last.role === role && typeof content === 'string' && typeof last.content === 'string') last.content += '\n' + content;
    else out.push({ role, content });
  });
  return out;
}
async function callBear(extra){
  const msgs = buildMsgs();
  const r = await fetch(settings.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-key': settings.key },
    body: JSON.stringify({ system: buildSystem() + (extra||''), messages: msgs })
  });
  if(!r.ok) throw new Error('proxy ' + r.status);
  const data = await r.json();
  return data.choices?.[0]?.message?.content || '';
}

function onPickImage(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
      cv.width = img.width*sc; cv.height = img.height*sc;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      sendImage(cv.toDataURL('image/jpeg', 0.82));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
  inp.value = '';
}

function sendImage(dataURL){
  if(!settings.url || !settings.key){
    addSys('先去设置里填代理地址和口令哦');
    openSettings(); return;
  }
  history.push({ role:'user', content:'[图片]', img: dataURL, t:Date.now() });
  addBubble('user', '[图片]', null, dataURL);
  store.set('kb_chat', history);
  bearReply();
}

async function bearReply(){
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  showTyping(true);
  const t0 = Date.now();
  try{
    let reply = await callBear();
    if(badReply(reply)) reply = await callBear('\n（重申：不要写代码、不要说自己是AI，日常短信语气）');
    const wait = Math.max(0, 1200 - (Date.now() - t0));
    setTimeout(()=>{
      showTyping(false); btn.disabled = false;
      const OK_SHORT = ['嗯','好','……','…','ㅋㅋㅋ','哈哈','哦'];
      const parts = reply.split('|||').map(s=>s.trim()).filter(Boolean)
        .filter(p => p.length > 2 || OK_SHORT.includes(p))
        .slice(0,3);
      if(parts.length === 0){ addBubble('bear', '……'); history.push({role:'bear', content:'……', t:Date.now()}); store.set('kb_chat', history); return; }
      parts.forEach((p, i)=>{
        setTimeout(()=>{
          history.push({ role:'bear', content:p, t:Date.now() });
          addBubble('bear', p);
          store.set('kb_chat', history);
          if(i === parts.length-1) gainAff(parts.join(''));
        }, i * 1000);
      });
      maybeUpdateMemory();
      schedulePush();
    }, wait);
  }catch(e){
    showTyping(false); btn.disabled = false;
    addSys('没连上……检查设置里的代理地址和口令');
  }
}

function mergeMemo(oldM, newM){
  const olds = oldM.split('\n').map(s=>s.trim()).filter(Boolean);
  const news = newM.split('\n').map(s=>s.trim()).filter(Boolean);
  const merged = olds.slice();
  news.forEach(n => {
    if(!merged.some(o => o === n || (n.length > 8 && o.replace(/\s/g,'').includes(n.replace(/\s/g,'').slice(0,10))))) merged.push(n);
  });
  return merged.slice(-60).join('\n');
}

function maybeUpdateMemory(){
  const userCount = history.filter(m=>m.role==='user').length;
  if(userCount === 0 || userCount % 8 !== 0) return;
  if(store.get('kb_memo_at', 0) === userCount) return;
  store.set('kb_memo_at', userCount);
  callBear(`\n\n【系统任务】列出这次对话中你新了解到的关于"小闪"的信息，每行一条：
[事实] 她稳定的喜好、身份、习惯
[约定|进行中] 她计划要做、你们约好、进行中的事
[约定|已完结] 已经完成、结束的事
只输出新内容，不要照抄已有档案：
${settings.memo||'（无）'}`)
    .then(facts => {
      facts = facts.replace(/```|\*\*|#|作为AI/gi,'').trim();
      if(facts.length < 10) return;
      settings.memo = mergeMemo(settings.memo || '', facts);
      store.set('kb_settings', settings);
      addSys('他悄悄记住了一些关于你的事');
    }).catch(()=>{});
}

let syncTimer = null;
function syncStatus(t){ const el = document.getElementById('syncHint'); if(el) el.textContent = t; }
function collectData(){

    settings:{ name: settings.name, memo: settings.memo, milk: settings.milk },

function applyRemote(d){
  if(!d) return false;
  history = d.history || [];
  aff = d.aff || { pts: 0 };
  if(d.settings){ settings.name = d.settings.name || settings.name; settings.memo = d.settings.memo || ''; if(d.settings.milk !== undefined) settings.milk = d.settings.milk; }
  store.set('kb_chat', history); store.set('kb_aff', aff); store.set('kb_settings', settings);
  applyName(); applyAff(); renderAll();
  return true;
}
async function gistRequest(method, path, body){
  const r = await fetch('https://api.github.com' + path, {
    method,
    headers: { 'Authorization': 'token ' + settings.token, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error('github ' + r.status);
  return r.json();
}
async function syncPull(){
  if(!settings.token) return;
  try{
    if(!settings.gistId){
      const gists = await gistRequest('GET', '/gists');
      const found = (gists || []).find(g => g.files && g.files['bear-chat.json']);
      if(found){ settings.gistId = found.id; store.set('kb_settings', settings); }
      else { syncStatus('还没有云端备份，聊一句后会自动创建'); return; }
    }
    const g = await gistRequest('GET', '/gists/' + settings.gistId);
    const raw = g.files['bear-chat.json'] && g.files['bear-chat.json'].raw_url;
    if(!raw) return;
    const d = await (await fetch(raw)).json();
    const lastKnown = store.get('kb_sync_at', 0);
    if(d.updatedAt && d.updatedAt > lastKnown){
      if(applyRemote(d)){
        store.set('kb_sync_at', d.updatedAt);
        syncStatus('已从云端同步 ' + fmtTime(d.updatedAt));
        addSys('已从云端同步你们的回忆');
      }
    } else syncStatus('云端暂无更新');
  }catch(e){ syncStatus('同步失败：' + e.message); }
}
async function syncPush(){
  if(!settings.token) return;
  try{
    const data = collectData();
    if(!settings.gistId){
      const g = await gistRequest('POST', '/gists', { description:'bear-chat backup', public:false, files:{ 'bear-chat.json': { content: JSON.stringify(data) } } });
      settings.gistId = g.id; store.set('kb_settings', settings);
    } else {
      await gistRequest('PATCH', '/gists/' + settings.gistId, { files:{ 'bear-chat.json': { content: JSON.stringify(data) } } });
    }
    store.set('kb_sync_at', data.updatedAt);
    syncStatus('已同步 ' + fmtTime(data.updatedAt));
  }catch(e){ syncStatus('同步失败：' + e.message); }
}
function schedulePush(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 8000); }

/* ===== 设置 ===== */
function buildSwatches(){
  const box = document.getElementById('swatches');
  box.innerHTML = '';
  BGS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (settings.bgimg ? '' : (settings.bg === c ? ' on' : ''));
    s.style.background = c;
    s.onclick = ()=>{ settings.bg = c; settings.bgimg = ''; store.set('kb_settings', settings); buildSwatches(); applyBg(); };
    box.appendChild(s);
  });
}
function onBgFile(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{ settings.bgimg = rd.result; store.set('kb_settings', settings); buildSwatches(); applyBg(); addSys('背景已更换'); };
  rd.readAsDataURL(f);
}
function onMyAv(inp){
  const f = inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    // 压缩过大的图
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      const sc = Math.min(1, 200 / Math.max(img.width, img.height));
      cv.width = img.width*sc; cv.height = img.height*sc;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      settings.myav = cv.toDataURL('image/jpeg', 0.85);
      store.set('kb_settings', settings);
      addSys('你的头像已更新');
      document.getElementById('sheet').classList.contains('show') || renderAll();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}
function milkHint(){ document.getElementById('milkHint').textContent = settings.milk > 0 ? `当前：${settings.milk}%（手动）` : '当前：自动（随关系阶段）'; }
document.getElementById('sMilk') && document.getElementById('sMilk').addEventListener('input', e=>{ settings.milk = parseInt(e.target.value); milkHint(); });

function openSettings(){
  document.getElementById('sName').value = settings.name || '';
  document.getElementById('sMilk').value = settings.milk;
  milkHint();
  document.getElementById('sUrl').value = settings.url || '';
  document.getElementById('sKey').value = settings.key || '';
  document.getElementById('sMemo').value = settings.memo || '';
  document.getElementById('sToken').value = settings.token || '';
  buildSwatches();
  document.getElementById('mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSettings(){
  document.getElementById('mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function saveSettings(){
  settings.name = document.getElementById('sName').value.trim();
  settings.url  = document.getElementById('sUrl').value.trim();
  settings.key  = document.getElementById('sKey').value.trim();
  settings.memo = document.getElementById('sMemo').value.trim();
  settings.token = document.getElementById('sToken').value.trim();
  store.set('kb_settings', settings);
  applyName(); closeSettings();
  addSys('设置已保存');
  schedulePush();
  if(settings.token) syncPull();
}
function clearChat(){
  if(!confirm('清空和他的聊天记录？（记忆档案保留）')) return;
  history = []; store.set('kb_chat', history);
  store.set('kb_memo_at', 0);
  renderAll(); closeSettings();
  schedulePush();
}
function clearMemory(){
  if(!confirm('清空关于你的记忆档案？他会忘记所有关于你的事。')) return;
  settings.memo = ''; store.set('kb_settings', settings);
  store.set('kb_memo_at', 0);
  document.getElementById('sMemo').value = '';
  addSys('记忆已清空');
  schedulePush();
}
function applyName(){
  document.getElementById('topName').textContent = '金钟熊';
  document.getElementById('topStatus').textContent = settings.name || '在线 · 一直跳舞的熊';
  document.title = '金钟熊';
}

let proactiveBusy = false;
function fireProactive(){
  if(proactiveBusy) return;
  proactiveBusy = true;
  showTyping(true);
  const d = new Date();
  callBear(`\n\n（现在由你先发起对话：时间是${daypart(d.getHours())} ${ampmTime()}。她有一阵没说话了。结合记忆档案、你的工作日常（刚下通告/在彩排间隙/在录音棚/在车上/收工路上）和未完结的约定，用2-3条消息自然开场。当作正常聊天，不要提及"开场"二字。）`)
    .then(reply => {
      showTyping(false); proactiveBusy = false;
      if(badReply(reply) || !reply) return;
      reply.split('|||').map(s=>s.trim()).filter(Boolean).slice(0,3).forEach((p,i)=>{
        setTimeout(()=>{ history.push({role:'bear', content:p, t:Date.now()}); addBubble('bear', p); store.set('kb_chat', history); }, i*1000);
      });
    })
    .catch(()=>{ showTyping(false); proactiveBusy = false; });
}

function maybeProactive(){
  if(!settings.url || !settings.key || history.length === 0) return;
  const now = Date.now();
  const lastOpen = store.get('kb_lastopen', 0);
  store.set('kb_lastopen', now);
  if(now - lastOpen >= 6*3600*1000) setTimeout(fireProactive, 1200);
}

/* 她一小时没说话 → 他主动 */
setInterval(()=>{
  if(!settings.url || !settings.key || history.length === 0) return;
  if(document.hidden) return;
  const now = Date.now();
  const lastUser = [...history].reverse().find(m => m.role === 'user');
  if(!lastUser || now - lastUser.t < 30*60*1000) return;
  const lastAny = history[history.length-1];
  if(lastAny.role === 'bear' && now - lastAny.t < 30*60*1000) return;
  fireProactive();
}, 60000);

document.getElementById('topAv').src = 'data:image/jpeg;base64,' + BEAR_AV;
applyName();
applyAff();
renderAll();
if(settings.token) syncPull();
maybeProactive();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
